name: Electronic Archive Contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:electronic-archive
      - run: npm run build
