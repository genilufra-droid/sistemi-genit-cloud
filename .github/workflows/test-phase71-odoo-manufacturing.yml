name: Test Phase 7.1 Odoo manufacturing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  manufacturing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genit_mfg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d genit_mfg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/genit_mfg_test
      JWT_SECRET: phase71-manufacturing-test-secret-minimum-32-characters
      NODE_ENV: test
      CORS_ORIGIN: http://127.0.0.1:4173
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate API source
        run: |
          cd apps/api
          npm ci --workspaces=false
          npm run check
      - name: Build web with manufacturing module
        run: |
          cd apps/web
          npm ci --workspaces=false
          VITE_API_URL=http://127.0.0.1:3000 GENIT_CLOUD_REQUIRED=true npm run build
          grep -q 'SG_PHASE71_ODOO_MANUFACTURING_UI_START' dist/index.html
          grep -q 'SG_PHASE71_MANUFACTURING_DOCUMENT_LINKS_START' dist/index.html
          grep -q 'PRODHIMI' dist/index.html
          grep -q 'manufacturingWorkOrders' dist/index.html
          grep -q 'openManufacturingSampleDocument' dist/index.html
          grep -q 'openManufacturingCampaignDocument' dist/index.html
          grep -q 'openManufacturingWorkOrderDocument' dist/index.html
          grep -q 'openManufacturingTransferDocument' dist/index.html
      - name: Start API
        run: |
          cd apps/api
          npm start >/tmp/phase71-api.log 2>&1 &
          echo $! >/tmp/phase71-api.pid
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/phase71-api.log
          exit 1
      - name: Verify manufacturing tables and routes
        run: |
          node <<'NODE'
          const pg=require('./apps/api/node_modules/pg');
          (async()=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();
          for(const table of ['mfg_processes','mfg_workcenters','mfg_samples','mfg_sample_lines','mfg_campaigns','mfg_campaign_components','mfg_quality_gates','mfg_internal_transfers']){
            const r=await c.query('SELECT to_regclass($1) name',[`public.${table}`]);if(!r.rows[0].name)throw new Error(`Missing ${table}`);
          }
          const cols=await c.query("SELECT column_name FROM information_schema.columns WHERE table_name='process_orders' AND column_name IN('campaign_id','process_id','workcenter_id','qc_status','started_at','completed_at')");
          if(cols.rowCount!==6)throw new Error('Manufacturing columns missing from process_orders');
          await c.end();console.log('PHASE71_SCHEMA_SUCCESS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          for path in \
            /api/manufacturing/bootstrap \
            /api/manufacturing/samples/00000000-0000-0000-0000-000000000000 \
            /api/manufacturing/campaigns/00000000-0000-0000-0000-000000000000 \
            /api/manufacturing/work-orders/00000000-0000-0000-0000-000000000000 \
            /api/manufacturing/transfers/00000000-0000-0000-0000-000000000000; do
            status=$(curl -s -o /tmp/mfg.json -w '%{http_code}' "http://127.0.0.1:3000${path}")
            test "$status" = "401"
          done
      - name: Show API log
        if: always()
        run: cat /tmp/phase71-api.log || true
      - name: Stop API
        if: always()
        run: test -f /tmp/phase71-api.pid && kill $(cat /tmp/phase71-api.pid) || true
