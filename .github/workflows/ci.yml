name: Check Sistemi Genit Cloud
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genit_critical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genit_critical_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/genit_critical_test
      JWT_SECRET: critical-business-flow-secret-minimum-32-characters
      NODE_ENV: test
      CORS_ORIGIN: http://127.0.0.1:4173
      PORT: 3000
      TEST_API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Check API
        working-directory: apps/api
        run: npm ci && npm run check
      - name: Start API
        working-directory: apps/api
        run: |
          npm start > /tmp/genit-critical-api.log 2>&1 &
          echo $! > /tmp/genit-critical-api.pid
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && exit 0
            if ! kill -0 $(cat /tmp/genit-critical-api.pid) 2>/dev/null; then
              tail -n 160 /tmp/genit-critical-api.log
              exit 1
            fi
            sleep 1
          done
          tail -n 160 /tmp/genit-critical-api.log
          exit 1
      - name: Verify critical business flow
        run: npm run test:critical-flow
      - name: Build Web
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Show API diagnostics
        if: always()
        run: tail -n 200 /tmp/genit-critical-api.log || true
      - name: Stop API
        if: always()
        run: test -f /tmp/genit-critical-api.pid && kill $(cat /tmp/genit-critical-api.pid) || true
