name: Azure Container Apps Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.api'
      - 'Dockerfile.web'
      - '.github/workflows/azure-container-apps.yml'

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t "${{ vars.AZURE_ACR_LOGIN_SERVER }}/sistemi-genit-api:${IMAGE_TAG}" .
          docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/sistemi-genit-api:${IMAGE_TAG}"

      - name: Build and push Web image
        run: |
          docker build -f Dockerfile.web -t "${{ vars.AZURE_ACR_LOGIN_SERVER }}/sistemi-genit-web:${IMAGE_TAG}" .
          docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/sistemi-genit-web:${IMAGE_TAG}"

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_API_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/sistemi-genit-api:${IMAGE_TAG}"

      - name: Deploy Web Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/sistemi-genit-web:${IMAGE_TAG}"
